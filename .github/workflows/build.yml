name: Build Horizon Nav Thai

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'localization/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-thai-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Verify reviewed translation catalogue
        run: |
          python3 tools/generate_thai_catalog.py
          git diff --exit-code -- app/src/main/kotlin/com/headunit/launcher/ThaiCatalog.kt
          python3 tools/check_thai_sources.py
      # A fork has none of upstream's signing secrets. Keep this preview's own key
      # between builds; it never uses upstream's identity. Configure a private
      # release keystore before distributing a production version.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: horizon-thai-preview-signing-v1
      - name: Prepare preview signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Horizon Nav Thai Preview,O=Natreethon,C=TH'
          fi
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build translated sources
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: gradle :app:testPublicReleaseUnitTest :app:assemblePublicRelease :app:collectApks --stacktrace
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/HorizonNav-Thai.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/HorizonNav-Thai.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-Thai
          path: app/build/outputs/apk/release/HorizonNav-Thai.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
      - name: Publish Thai preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/HorizonNav-Thai.apk
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          sha256sum "$APK" | awk '{print $1}' > HorizonNav-Thai.apk.sha256
          python3 - <<'PY'
          import json, os
          build = int(os.environ['GITHUB_RUN_NUMBER'])
          with open('version.json', 'w') as f:
              json.dump({'version': f'1.0.{build}', 'build': build, 'versionCode': 100 + build}, f)
          PY
          if gh release view app >/dev/null 2>&1; then
            gh release edit app --title "Horizon Nav ไทย ${VERSION}" --notes-file README_TH.md --prerelease
          else
            gh release create app --target "$GITHUB_SHA" --title "Horizon Nav ไทย ${VERSION}" --notes-file README_TH.md --prerelease
          fi
          gh release upload app "$APK" HorizonNav-Thai.apk.sha256 version.json --clobber
